name: validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (node ${{ matrix.node }}, ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Node on a plain Postgres, the current LTS on Postgres with
          # pgvector: the migrations take a different path when the vector extension exists.
          - node: 22
            postgres: postgres:15
          - node: 24
            postgres: pgvector/pgvector:pg17
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --legacy-peer-deps: the lockfile has no entry for the optional Payload MCP peer.
      - run: npm ci --legacy-peer-deps
      - run: npm run validate
